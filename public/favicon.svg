<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182533"/>
      <stop offset="100%" stop-color="#0a121a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d672"/>
      <stop offset="50%" stop-color="#d4a34a"/>
      <stop offset="100%" stop-color="#b88328"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0b3c6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background badge with dark naval gradient and gold border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Waterline waves -->
  <path d="M6 46 C 16 43, 24 47, 36 44 C 46 41.5, 54 45, 58 44" stroke="#00d4aa" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M8 50 C 18 48, 28 51, 40 49 C 48 47.5, 54 50, 56 49.5" stroke="#4aa3df" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Mast and Radar -->
  <path d="M33 14 L33 26 M31 16 L35 16 M29 19 L37 19 M33 13 L33 11" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Bridge Superstructure -->
  <path d="M26 27 L28 20 L37 20 L39 25 L43 27 Z" fill="url(#hullGrad)" filter="url(#glow)"/>
  <rect x="29.5" y="22" width="6" height="2" rx="0.5" fill="#182533"/>

  <!-- Forward Gun Turrets and Barrels -->
  <path d="M11 32 L20 32 M13 34 L21 34" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M18 31 L23 31 L24 35 L17 35 Z" fill="url(#hullGrad)"/>

  <!-- Aft Gun Turret -->
  <path d="M49 33 L42 33" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M41 32 L46 32 L45 35 L40 35 Z" fill="url(#hullGrad)"/>

  <!-- Main Hull -->
  <path d="M8 36 L56 36 L51 44 C 40 45, 20 45, 12 42 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Waterline Boot-topping Accent -->
  <path d="M10 40 L53 40 L51 43.5 C 38 44.5, 20 44.5, 12 42 Z" fill="#00d4aa" opacity="0.9"/>
</svg>